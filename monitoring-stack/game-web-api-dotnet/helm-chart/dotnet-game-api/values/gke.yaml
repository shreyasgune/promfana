service:
  type: LoadBalancer
svcMon: true

# Simulating autoscale
resources:
  requests:
    cpu: 100m  # 10 millicores (0.01 CPU)
    memory: 20Mi  # 5 MiB RAM
  limits:
    cpu: 100m  # 50 millicores (0.05 CPU)
    memory: 20Mi  # 5 MiB RAM

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 2
  targetMemoryUtilizationPercentage: 2

replicaCount: 1